services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: jumpserver-ticketing-frontend
    restart: unless-stopped
    ports:
      - "48080:80"
    environment:
      JUMPSERVER_URL: ""
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: jumpserver-ticketing-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: 3001
      JUMPSERVER_URL: ""
      JUMPSERVER_ORG_ID: ""
      JUMPSERVER_SERVICE_TOKEN: ""
      JUMPSERVER_TIMEZONE_OFFSET: ""
      TEAM_GROUPS: ""
      TEAM_GROUPS_IGNORE: ""
